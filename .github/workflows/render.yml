name: render

on:
  schedule:
    - cron: "47 22 * * *" # 04:17 IST, inside 03:00-06:00, the one window with zero commits
  workflow_dispatch:
  push:
    paths: ["src/**", ".github/workflows/render.yml"]

permissions:
  contents: write

concurrency: render

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch aggregates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python src/fetch.py "${{ github.repository_owner }}" data/stats.json
      - name: Render
        run: python src/render.py data/stats.json assets
      - name: Commit
        run: |
          git config user.name "render[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets
          git diff --cached --quiet || { git commit -m "render: $(date -u +%F)"; git push; }
