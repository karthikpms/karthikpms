<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="man karthik: a Unix manual page describing Karthik."><title>man karthik: a Unix manual page describing Karthik.</title><style>
      .mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:13px;white-space:pre}
      .h{fill:#6b7280} .s{fill:#f4f4f5;font-weight:700} .t{fill:#c7cbd3}
      .ln{animation:in .18s ease-out backwards}
      @keyframes in{from{opacity:0}}
      .typed{width:110px;animation:type 1.1s steps(12,end) .3s backwards}
      @keyframes type{from{width:0}to{width:110px}}
      .cur{animation:blink 1s steps(2,end) infinite}
      @keyframes blink{50%{opacity:0}}
    </style><rect width="1000" height="560" rx="12" fill="#0c0c0e"/><rect x=".5" y=".5" width="999" height="559" rx="12" fill="none" stroke="#26262b"/><rect width="1000" height="34" rx="12" fill="#18181b"/><rect y="22" width="1000" height="12" fill="#18181b"/><circle cx="22" cy="17" r="6" fill="#ff5f57"/><circle cx="42" cy="17" r="6" fill="#febc2e"/><circle cx="62" cy="17" r="6" fill="#28c840"/><text x="500.0" y="21" text-anchor="middle" class="mono" fill="#71717a" style="font-size:12px">karthik@pyramidion: ~</text><clipPath id="tc"><rect class="typed" x="44" y="50" width="110" height="24"/></clipPath><text x="28" y="66" class="mono" fill="#4ade80">$</text><text x="44" y="66" class="mono t" clip-path="url(#tc)"> man karthik</text><text x="28" y="98" class="mono ln h" style="animation-delay:1.60s">KARTHIK(1)                                          Pyramidion Manual                                   KARTHIK(1)</text><text x="28" y="136" class="mono ln s" style="animation-delay:1.74s">NAME</text><text x="28" y="155" class="mono ln t" style="animation-delay:1.81s">       karthik - turns ambiguous requirements into production systems</text><text x="28" y="193" class="mono ln s" style="animation-delay:1.95s">SYNOPSIS</text><text x="28" y="212" class="mono ln t" style="animation-delay:2.02s">       karthik [--voice-ai] [--flutter] [--backend] [--terraform apply]</text><text x="28" y="231" class="mono ln t" style="animation-delay:2.09s">               [-y | --ship-it] &lt; requirements.docx &gt; production</text><text x="28" y="269" class="mono ln s" style="animation-delay:2.23s">OPTIONS</text><text x="28" y="288" class="mono ln t" style="animation-delay:2.30s">       --voice-ai     Phone agents that listen, interrupt politely, and call tools.</text><text x="28" y="307" class="mono ln t" style="animation-delay:2.37s">       --flutter      One codebase, two app stores, zero excuses.</text><text x="28" y="326" class="mono ln t" style="animation-delay:2.44s">       --backend      Multi-tenant TypeScript. Bun when allowed, Node when not.</text><text x="28" y="345" class="mono ln t" style="animation-delay:2.51s">       --terraform    Infrastructure you can delete and rebuild before lunch.</text><text x="28" y="383" class="mono ln s" style="animation-delay:2.65s">EXIT STATUS</text><text x="28" y="402" class="mono ln t" style="animation-delay:2.72s">       0      Shipped. (5,078 times in the last 365 days.)</text><text x="28" y="421" class="mono ln t" style="animation-delay:2.79s">       3      Prowler found something. Fixed before you read this line.</text><text x="28" y="459" class="mono ln s" style="animation-delay:2.93s">BUGS</text><text x="28" y="478" class="mono ln t" style="animation-delay:3.00s">       fix: commits outnumber feat: commits 205 to 110. Working as intended.</text><text x="28" y="497" class="mono ln t" style="animation-delay:3.07s">       111 of the last 1,000 commits landed between 00:00 and 03:00 IST. 0 landed</text><text x="28" y="516" class="mono ln t" style="animation-delay:3.14s">       between 03:00 and 06:00. That is the only maintenance window.</text><rect x="28" y="533" width="320" height="18" fill="#e4e4e7" class="ln" style="animation-delay:3.21s"/><text x="34" y="546" class="mono ln" style="animation-delay:3.21s;fill:#0c0c0e">Manual page karthik(1) line 1 (press q)</text><rect x="352" y="533" width="8" height="18" fill="#e4e4e7" class="cur"/></svg>
